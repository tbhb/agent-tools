# The Python side of agent-tools. Today it carries one module, kept
# deliberately small: the toolchain at the repository root needs a real
# subject to verify against, and a package that lints, type checks, and
# reaches full branch coverage proves the gates work before any weight
# rests on them. The agent eval work this repository is headed toward
# lands here.
[project]
name = "agent-tools-py"
version = "0.1.1"
description = "Python support library for tbhb agent tooling"
authors = [{ name = "Tony Burns" }]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

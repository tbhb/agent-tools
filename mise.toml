#:schema https://mise.jdx.dev/schema/mise.json
# Repo-specific toolchain pins and task definitions. Together with the
# drop-ins under .config/mise/conf.d/ this replaces the Brewfile, which
# could not pin a version, and holds every recipe that provisions its
# tools from the pins.
#
# The split: the conf.d drop-ins hold what the shared payload publishes
# (baseline pins and the repotools:-namespaced tasks), and this file
# holds what is specific to this repository. Root pins override drop-in
# pins, which is the consumer-override mechanism working at home.
#
# What stayed in the Justfile, and why:
#
#   - The Go test and coverage recipes the CI matrix runs on Windows.
#     Ported task bodies are bash by the shebang rule below, and mise's
#     handling of bash-shebang bodies on a Windows runner is unverified,
#     while `just` on those runners is proven.
#   - Thin delegation recipes for the names the APM primitives invoke.
#     Those skills still spell their gates `just <recipe>`.

[settings]
# Record resolved versions, URLs, and digests in the lockfiles. Each
# config file locks to its own sibling: this file to ./mise.lock, the
# conf.d drop-ins to .config/mise/mise.lock. Both are committed. The
# files have to exist before mise will populate them; `lockfile = true`
# alone does not create them. Refresh every platform CI or development
# runs with:
#   mise lock --platform linux-x64,linux-arm64,macos-arm64,windows-x64
lockfile = true

# uv owns the Python interpreters. Without this, mise reads
# .python-version too (the default allowlist is ["node", "python"]) and
# installs its own python, which uv then finds on PATH -- the same
# interpreter with two owners, provisioned twice. Observed directly:
# `mise install` fetched python 3.14.6 before this setting existed. The
# similarly named idiomatic_version_file_disable_tools reads back but
# does nothing. node is dropped from the allowlist too: the node pin
# lives in conf.d and no .nvmrc exists here. The pipx backend behind
# yamllint is unaffected; it resolves through uv.
idiomatic_version_file_enable_tools = []

# Just ran [script] recipes under `bash -eu`. mise has no project-level
# counterpart: it defaults to `sh -c -o errexit`, and it refuses a
# `unix_default_inline_shell_args` override from a non-global config on
# security grounds. Every ported body that needs bash therefore opens
# with a shebang, which mise honors. Leaving one implicit would hide the
# difference until CI: macOS /bin/sh is bash in POSIX mode and tolerates
# [[ ]], while the ubuntu runners' /bin/sh is dash and does not.

# The shared baseline pins live in .config/mise/conf.d/. The pins below
# are the tools only this repository uses. python is deliberately absent:
# uv owns the interpreters, reading .python-version and provisioning its
# own managed builds, and a second python from mise would give the same
# interpreter two owners. The pipx backend behind yamllint resolves
# through uv as well.
[tools]
gitleaks = "8.30.1"
jq = "1.8.2"
shfmt = "3.13.1"
uv = "0.12.1"

# --- Setup ---

# Replaces the `setup` recipe. An ordered run array rather than
# `depends`, which runs in parallel: install-tools runs `vale sync`
# against the vale the previous step installs. The name follows the mise
# ecosystem convention settled in the migration spike; once this
# repository vendors shared config, a `vendir sync` step joins the front
# of the list.
[tasks.bootstrap]
description = "Set up the dev environment, refresh Vale styles, and install git hooks"
run = [
  "mise run install-toolchain",
  "mise run install-tools",
  "mise run prek-install",
]

[tasks.install-toolchain]
description = "Install the pinned toolchain from mise.toml and conf.d"
run = "mise install"

# Vale's synced style packages, plus the Python toolchain the code under
# packages/ is linted and tested with. `uv sync` reads uv.lock, so every
# contributor and CI runner gets the same versions.
[tasks.install-tools]
description = "Refresh non-mise tooling (Vale style packages, Python dependencies)"
run = ["vale sync", "uv sync"]

# Replaces check-tombi-version, which only warned. This gates:
# --dry-run-code exits 1 when a pinned tool is missing.
#
# MISE_LOCKED=1 makes a version absent from the lockfiles a failure
# rather than something mise silently fetches and re-locks, which is what
# would let a Renovate PR bumping a pin alone pass while the committed
# digests drift.
#
# The empty MISE_CONFIG_DIR is what scopes that check to this repository.
# `locked` applies to the merged tool set, so without it the gate fails
# on whatever unlocked tools a developer happens to declare in their own
# ~/.config/mise/config.toml -- tools this repo neither declares nor
# uses.
[tasks.check-toolchain]
description = "Gate the installed toolchain against the mise config and lockfiles"
run = '''
#!/usr/bin/env bash
set -euo pipefail
empty_cfg=$(mktemp -d)
trap 'rm -rf "$empty_cfg"' EXIT
if MISE_CONFIG_DIR="$empty_cfg" MISE_LOCKED=1 mise install --dry-run-code; then
  echo "toolchain matches the mise config and lockfiles"
else
  echo "toolchain is out of date, or a pin is missing from a lockfile" >&2
  echo "         run 'mise run install-toolchain', or 'mise lock --platform linux-x64,linux-arm64,macos-arm64,windows-x64' after moving a pin" >&2
  exit 1
fi
'''

# --- Build ---
# CGO_ENABLED=0 removes the host C toolchain as a build input.
# -buildvcs=false avoids stamping VCS state, required for bit-for-bit
# matches against CI builds. tools/go-ldflags.sh computes the reproducible
# build metadata (committer date rather than build time, abbreviated
# hashes pinned to 7) that the Justfile used to hold in variables.

[tasks.build]
description = "Build every binary into the bin directory"
run = 'CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "$(bash tools/go-ldflags.sh)" -o bin/ ./cmd/...'

[tasks.install]
description = "Install every binary to GOPATH/bin"
run = 'CGO_ENABLED=0 go install -trimpath -buildvcs=false -ldflags "$(bash tools/go-ldflags.sh)" ./cmd/...'

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf bin dist coverage.out coverage.html coverage.txt coverage.xml coverage.covdata*"

# --- Format ---

[tasks.format-go]
description = "Format Go code via golangci-lint's formatters"
run = "golangci-lint fmt"

# The in-place fixer paired with lint-shell-fmt's -d gate. shfmt reads
# indent width and the final-newline setting from .editorconfig. The
# vendor/ exclusion matches lint-shell: those scripts belong to upstream.
# The .claude/ exclusion is the same idea from the other direction: those
# scripts are byte copies that `apm install` deploys, so formatting them
# here would put a second writer in a tree the installer owns. The
# emptiness guard keeps shfmt from falling back to reading stdin (and
# hanging) if the tree ever has no matching script. `--others` reaches a
# new script before staging does.
[tasks.format-shell]
description = "Format shell scripts in place via shfmt"
run = '''
#!/usr/bin/env bash
set -eu
files=$(git ls-files --cached --others --exclude-standard '*.sh' ':!:vendor/**' ':!:.claude/**')
if [ -n "$files" ]; then shfmt -w $files; fi
'''

# Rewrites in place; lint-ruff-format is the --check counterpart CI runs.
# Scope comes from [tool.ruff] in pyproject.toml, so the path-less
# invocation walks the whole tree, tests included.
[tasks.format-py]
description = "Format Python code in place via ruff's formatter"
run = "uv run ruff format"

# --- Fix ---

# `go fix` (Go 1.26+) runs the modernizer analyzers; the blog post
# (https://go.dev/blog/gofix) recommends running it to a fixed point --
# usually one extra pass picks up fixes that became valid after the
# first round. golangci-lint fmt + --fix run afterward.
# --modules-download-mode=vendor matches the build, so the linter sees
# exactly the dependency set the compiler does and never falls back to
# the module proxy.
[tasks.fix-go]
description = "Fix Go linting issues"
run = [
  "go fix ./...",
  "go fix ./...",
  "golangci-lint fmt",
  "golangci-lint run --fix --modules-download-mode=vendor",
]

# Applies only ruff's safe autofixes; anything it leaves behind needs a
# human. Pair with format-py, which handles layout rather than lint.
[tasks.fix-py]
description = "Fix Python linting issues"
run = "uv run ruff check --fix"

[tasks.fix-markdown-wrap]
description = "Join every hard-wrapped Markdown paragraph back into one line"
run = "mise run lint-markdown-wrap -- --fix"

# --- Lint ---

[tasks.lint-go]
description = "Run Go linters via golangci-lint (vendor-mode)"
run = "golangci-lint run --modules-download-mode=vendor"

# The compiler covers cycles and cross-module visibility; this catches
# the layer rules it can't (e.g., "cmd may depend on internal but not
# the reverse").
[tasks.lint-go-arch]
description = "Enforce intra-project layering rules from .go-arch-lint.yml"
run = "go-arch-lint check"

# Covers the standalone scripts actionlint never opens (tools/fuzz.sh
# and its neighbors). `--others` puts a brand new script in the gate
# before anyone stages it, which is when its first shellcheck violation
# is cheapest to fix; without it a script escapes the gate for exactly
# as long as it is newest. `--exclude-standard` is what keeps a scratch
# script out, so a throwaway belongs in .gitignore rather than outside
# git's view. The `:!:vendor/**` pathspec drops the vendored upstream
# scripts, which are reviewed at vendor-tidy time rather than held to
# this project's style. The `:!:.claude/**` exclusion mirrors
# format-shell: those scripts are byte copies that `apm install`
# deploys. The emptiness guard matters because shellcheck with no path
# arguments reads stdin and blocks. This is a distinct gate from the
# shellcheck repotools:lint-workflows provides through actionlint: that
# one only ever sees `run:` blocks embedded in workflow YAML, and never
# opens the standalone scripts this gate covers.
[tasks.lint-shell]
description = "Lint every non-vendored *.sh git can see via shellcheck"
run = '''
#!/usr/bin/env bash
set -eu
files=$(git ls-files --cached --others --exclude-standard '*.sh' ':!:vendor/**' ':!:.claude/**')
if [ -n "$files" ]; then shellcheck $files; fi
'''

# Aggregates the Go gates, the Python gates, prose (vale), spelling
# (cspell), Markdown (rumdl), config / JS / TS (biome), YAML (yamllint),
# TOML (tombi), shell (shellcheck + shfmt), the Justfile's and this
# config's own formatting, and the .editorconfig whitespace contract. An
# ordered run array rather than `depends`, which runs in parallel and
# interleaves several linters' findings into one unreadable stream --
# the agent output template exists to make a finding self-contained.
[tasks.lint]
description = "Run every linter that operates on the source tree"
run = [
  "mise run lint-go-all",
  "mise run lint-py-all",
  "mise run lint-prose",
  "mise run repotools:lint-spelling",
  "mise run repotools:lint-markdown",
  "mise run lint-markdown-wrap",
  "mise run repotools:lint-config",
  "mise run repotools:lint-yaml",
  "mise run repotools:lint-toml",
  "mise run lint-shell",
  "mise run lint-shell-fmt",
  "mise run repotools:lint-just",
  "mise run repotools:lint-mise",
  "mise run lint-editorconfig",
  "mise run lint-skills",
  "mise run lint-script-hygiene",
]

# Same membership as the old lint-go-all recipe.
[tasks.lint-go-all]
description = "Aggregate every Go-flavored lint gate"
run = [
  "mise run lint-go",
  "mise run lint-go-modernize",
  "mise run lint-go-deadcode",
  "mise run lint-go-arch",
  "mise run repotools:lint-workflows",
]

# The Python counterpart to lint-go-all, covering the source under
# packages/ and its tests. lint-bandit rides with the source linters
# because the Go side runs gosec inside golangci-lint.
[tasks.lint-py-all]
description = "Aggregate every Python-flavored lint gate"
run = [
  "mise run lint-ruff-format",
  "mise run lint-ruff",
  "mise run lint-types",
  "mise run lint-complexity",
  "mise run lint-deadcode",
  "mise run lint-dup-code",
  "mise run lint-bandit",
]

# Report drift and fail without rewriting; format-py is the in-place
# counterpart.
[tasks.lint-ruff-format]
description = "Check Python formatting via ruff's formatter in --check mode"
run = "uv run ruff format --check"

# Rule selection and the justified ignore list live in pyproject.toml
# under [tool.ruff].
# Extra invocation args append to the command line, so
# `mise run lint-ruff packages/` scopes the check the way the old
# `just lint-ruff packages/` did. A `usage` variadic with an empty
# default is not equivalent: it passes a literal empty argument, which
# ruff rejects with E902.
[tasks.lint-ruff]
description = "Lint Python against the full ruff ruleset"
run = "uv run ruff check"

# The [tool.pyrefly] tables in pyproject.toml pin every error kind and
# name the project scope, so a bare project-mode check is the whole gate.
[tasks.lint-types]
description = "Type check with pyrefly"
run = "uv run pyrefly check"

# Scope and threshold live in pyproject.toml under [tool.complexipy].
[tasks.lint-complexity]
description = "Measure per-function cognitive complexity against the ceiling"
run = "uv run complexipy"

# Scope lives in pyproject.toml under [tool.vulture].
[tasks.lint-deadcode]
description = "Find dead Python code with vulture"
run = "uv run vulture"

# pylint pared down in pyproject.toml to its similarities checker alone
# -- the one message in pylint's catalog no other tool in the chain
# covers. pylint takes its scan roots on the command line rather than
# from config, so the scope lives here.
[tasks.lint-dup-code]
description = "Detect copy-pasted Python code with pylint"
run = "uv run pylint packages"

# The static second pass behind ruff's `S` rules -- ruff ports only part
# of bandit's checks and trails its releases. Pointing the scan at the
# package's src/ keeps the tests out: a suite leans on assert (B101),
# while ruff's `S` set still covers test code through per-file-ignores.
[tasks.lint-bandit]
description = "Scan the Python source for insecure code patterns with bandit"
run = "uv run bandit -r packages/repotools/src -q"

# The glob excludes the LICENSE (canonical Apache 2.0 text), the
# auto-generated changelog, vale's own style packages, scratch dirs,
# vendored code, the gitignored agent worktrees (whose nested vendor
# trees otherwise crash vale), and the agent drafts, which their own
# gates check under the stricter commit scope. Repo-specific, so it stays
# out of the shared drop-ins.
[tasks.lint-prose]
description = "Lint prose in Markdown files and source comments via vale"
usage = 'arg "<paths>..." default="."'
run = "vale --output=project-agent.tmpl --glob='!{LICENSE,CHANGELOG.md,.vale/*,tmp/*,vendor/*,.venv/*,.claude/worktrees/*,.pytest_cache/*,.complexipy_cache/*,COMMIT_AGENTMSG,PR_AGENTDESC.md,SQUASH_AGENTMSG}' $usage_paths"

# This repository's own check, applied to itself. `go run` rather than an
# installed binary so the gate reflects the working tree: a change to the
# detector is judged by the detector as changed, not by the last release.
# Scope comes from git rather than a shell glob so the file list matches
# what the other tree-wide gates see, minus the vendored Markdown that
# upstream hard-wrapped and this repository does not own.
# Invocation args arrive as shell positionals ahead of the file list, so
# `mise run lint-markdown-wrap -- --fix` reaches guard-markdown as
# `--fix <files>`.
[tasks.lint-markdown-wrap]
description = "Fail if any Markdown paragraph spans more than one line"
run = '''
#!/usr/bin/env bash
set -eu
files=$(git ls-files '*.md' ':!:vendor/**')
if [ -n "$files" ]; then go run ./cmd/guard-markdown "$@" $files; fi
'''

# The check-only mirror of format-shell: -d prints a unified diff and
# exits non-zero when shfmt would rewrite anything, so the gate reports
# the exact edit to make instead of silently reformatting a contributor's
# tree.
[tasks.lint-shell-fmt]
description = "Fail if shfmt would reformat any non-vendored *.sh git can see"
run = '''
#!/usr/bin/env bash
set -eu
files=$(git ls-files --cached --others --exclude-standard '*.sh' ':!:vendor/**' ':!:.claude/**')
if [ -n "$files" ]; then shfmt -d $files; fi
'''

# Enforces the whitespace contract in .editorconfig across every tracked
# file, catching the file types no other gate reads. The paths come from
# `git ls-files` rather than from the checker's own discovery: invoked
# bare it also walks untracked files, so any scratch file in the worktree
# would fail the gate and block a commit it has nothing to do with.
# Explicit paths still run through the Exclude list in
# .editorconfig-checker.json. Deliberately different from the bare
# invocation the other repos use, so it stays a local task.
[tasks.lint-editorconfig]
description = "Check every tracked file against .editorconfig"
run = "git ls-files -z | xargs -0 editorconfig-checker"

# The platform rejects a skill whose name or description breaks these
# bounds, and it does so at upload, far from the edit that caused it.
# Both are plain character counts, so this gate stays offline. The
# companion body-size guidance is measured in tokens and needs the
# network, so skill-tokens owns that one.
[tasks.lint-skills]
description = "Check every skill against the platform's name and description limits"
run = "bash tools/skill-limits.sh"

# An operator's git, gh, and locale settings can reshape the output these
# scripts print, and the agent reads that output. The scripts have a
# hardening block for it; this task is what keeps the block from quietly
# going missing on the next script somebody adds.
[tasks.lint-script-hygiene]
description = "Refuse a script whose output user configuration could reshape"
run = "bash tools/check-script-hygiene.sh"

# Count what each skill costs in context and write tokens.json beside it.
# Needs the `ant` CLI authenticated; kept out of `lint` because it calls
# the token-counting API.
[tasks.skill-tokens]
description = "Measure skill token costs against the real tokenizer"
run = "bash tools/skill-tokens.sh"

# Surfaces message problems while iterating rather than at commit time.
# Reads the draft from the repo-root COMMIT_AGENTMSG file and runs the
# commit-msg stage through prek, which fires the four shared
# commit-message hooks. The real gate stays the prek commit-msg hook on
# .git/COMMIT_EDITMSG; this task only mirrors it.
[tasks.lint-commit-msg]
description = "Pre-validate a drafted commit message against the commit-msg gates"
run = "prek run --stage commit-msg --commit-msg-filename COMMIT_AGENTMSG"

# Every other prose task runs one checker over many files. This runs
# every checker over one drafted document, and reports all of them in a
# single call. It also probes the path before trusting a clean run: vale
# matches a path against the sections in .vale.ini exactly, and a path no
# section names loads no styles, reads the file, prints nothing, and
# exits 0 -- byte for byte what a clean document produces.
[tasks.lint-draft]
description = "Lint one drafted document through every prose gate at once"
usage = 'arg "<file>"'
run = "bash tools/lint-draft.sh $usage_file"

# About a third of a typical vale run needs no judgment: the rule's own
# action holds the correction, and the output template already prints it
# as replace_with= on the finding line. This applies those and leaves the
# rest, refusing any finding whose span no longer holds the text the
# report quoted.
[tasks.fix-prose-replacements]
description = "Apply every vale finding that has its own replacement"
usage = 'arg "<file>"'
run = "bash tools/fix-prose-replacements.sh $usage_file"

# The pull request counterpart. The validator is mechanical and offline;
# vale and cspell then read the prose, under the same [*.md] rules the
# rest of the tree answers to. The draft is gitignored, so the tree-wide
# tasks skip it and this one owns it.
[tasks.lint-pr-description]
description = "Validate a drafted pull request description"
run = [
  "bash .claude/skills/pr/scripts/validate-description.sh",
  "vale --output=project-agent.tmpl PR_AGENTDESC.md",
  "cspell --config .cspell.jsonc --no-summary --no-progress PR_AGENTDESC.md",
]

# The squash message merge-pr writes never passes through git's
# commit-msg hook, because GitHub authors that commit rather than this
# machine. Running the same four hooks over the draft here is what keeps
# a squash commit answerable to the rules every other commit meets.
[tasks.lint-squash-msg]
description = "Pre-validate a drafted squash commit message against the commit-msg gates"
run = "prek run --stage commit-msg --commit-msg-filename SQUASH_AGENTMSG"

# Mirrors the vendor-drift check: contributors must run
# `mise run fix-go` before pushing.
[tasks.lint-go-modernize]
description = "Fail if `go fix` would modernize the tree"
run = '''
#!/usr/bin/env bash
set -eu
diff_output=$(go fix -diff ./... 2>&1)
if [[ -n "$diff_output" ]]; then
    echo "go fix would modernize the tree — run 'mise run fix-go' and commit:" >&2
    echo "$diff_output" >&2
    exit 1
fi
'''

# Whole-program reachability complements the package-scoped `unused`
# linter in golangci-lint. The tool prints findings but exits 0, so any
# output is treated as failure.
[tasks.lint-go-deadcode]
description = "Fail if `deadcode` finds unreachable functions from the binary entry points"
run = '''
#!/usr/bin/env bash
set -eu
output=$(go tool deadcode ./cmd/... 2>&1)
if [[ -n "$output" ]]; then
    echo "deadcode found unreachable code — remove or justify:" >&2
    echo "$output" >&2
    exit 1
fi
'''

# Noisier; intentionally not part of the default lint gate. Run before
# wholesale refactors to surface code only kept alive by tests.
[tasks.lint-go-deadcode-tests]
description = "Like lint-go-deadcode but roots reachability at every test binary too"
run = '''
#!/usr/bin/env bash
set -eu
output=$(go tool deadcode -test ./... 2>&1)
if [[ -n "$output" ]]; then
    echo "deadcode (with -test) found unreachable code:" >&2
    echo "$output" >&2
    exit 1
fi
'''

# --- Test ---
# test-go and test-go-race stay Justfile recipes: the CI matrix runs
# them on Windows.

[tasks.test]
description = "Run every test suite"
run = ["just test-go", "mise run test-py", "mise run test-hooks"]

# The shell hooks under scripts/ answer to bats rather than to
# `go test`, so they get a third suite alongside the two language ones.
# It joins the `test` aggregate because the commit-message gates every
# repository here installs are exactly the code a regression should
# stop. The bats pin means the suites pass under the same runner
# everywhere rather than whichever bats a contributor happens to have.
[tasks.test-hooks]
description = "Run the bats suites for the shell hooks under scripts/"
usage = 'arg "<path>" default="test"'
run = "bats $usage_path"

# Serial by default so a failing run prints a clean, ordered trace; pass
# `mise run test-py -n auto` to fan the suite across xdist workers.
[tasks.test-py]
description = "Run the Python tests"
run = "uv run pytest"

# Gremlins gates each mutant's test run at
# `coefficient * baseline_test_time`. The upstream default of 3 leaves a
# budget of a few hundred milliseconds for this project's sub-second test
# suites, so legitimate assertion kills get reclassified as TIMED OUT
# under any noticeable system load. 100 keeps the per-mutation worst case
# under a minute. Override by setting GREMLINS_TIMEOUT_COEFFICIENT.
[tasks.mutate-go]
description = "Run mutation testing via gremlins"
usage = 'arg "<path>" default="."'
run = 'go tool gremlins unleash --timeout-coefficient "${GREMLINS_TIMEOUT_COEFFICIENT:-100}" $usage_path'

# The nightly form, factored out so the mutation-nightly workflow has a
# single task to invoke and contributors can run the same scan locally
# before opening a release-bound PR.
[tasks.mutate-go-all]
description = "Mutate the whole module from the repository root"
run = 'go tool gremlins unleash --timeout-coefficient "${GREMLINS_TIMEOUT_COEFFICIENT:-100}" .'

# Both sweeps are slow enough to belong on a nightly schedule rather than
# in the inner loop; this is the entry point for running them locally.
[tasks.mutate]
description = "Run mutation testing across both source languages"
run = ["mise run mutate-go-all", "mise run mutate-py"]

# cosmic-ray is the Python counterpart to gremlins. Scope, per-mutant
# timeout, and the test command live in cosmic-ray.toml.
[tasks.mutate-py]
description = "Run mutation testing over the Python packages"
run = [
  "mkdir -p .cosmic-ray",
  "uv run cosmic-ray init cosmic-ray.toml .cosmic-ray/session.sqlite",
  "uv run cosmic-ray exec cosmic-ray.toml .cosmic-ray/session.sqlite",
  "uv run cr-report .cosmic-ray/session.sqlite --show-pending",
]

[tasks.fuzz]
description = "Run every fuzzing sweep"
run = ["mise run fuzz-go", "mise run fuzz-py"]

# tools/fuzz.sh lists every Fuzz* function under each package and runs it
# for the FUZZ_TIME budget (default 30s); the nightly workflow calls the
# same script with a longer FUZZ_TIME.
[tasks.fuzz-go]
description = "Run native Go fuzz targets under [path] (default the entire module)"
usage = 'arg "<path>" default="./..."'
run = "tools/fuzz.sh $usage_path"

# hypofuzz drives the existing hypothesis property tests under
# coverage-guided search. It never runs on a pull request: the nightly
# workflow gives it a real budget, and this task is the local form.
# A script body rather than a run string because invocation args have to
# go before the `--` separator, and appended args would end up after it.
[tasks.fuzz-py]
description = "Run the Python property tests under coverage-guided fuzzing"
run = '''
#!/usr/bin/env bash
set -eu
uv run hypothesis fuzz "$@" -- packages/*/tests/property
'''

# cover-go and its variants stay Justfile recipes alongside test-go.
[tasks.cover]
description = "Run every coverage gate"
run = ["just cover-go", "mise run cover-py"]

# The Python floor is absolute: [tool.coverage] in pyproject.toml sets
# fail_under = 100 with branch coverage on, so anything unreachable
# belongs in exclude_also with a reason rather than behind a lowered
# threshold.
[tasks.cover-py]
description = "Run the Python tests with branch coverage and enforce the 100% floor"
run = "uv run pytest --cov --cov-branch"

# Re-print the report and re-check the threshold against whatever data
# .coverage already holds, without rerunning the suite.
[tasks.cover-py-check]
description = "Re-check the Python coverage threshold without rerunning the suite"
run = "uv run coverage report"

# --- Security ---

# govulncheck walks the call graph and reports only vulnerabilities whose
# vulnerable symbols this module actually calls. Pinned as a `go tool`
# dep in go.mod so the scanner version is reproducible; bumped via
# Renovate.
[tasks.vuln]
description = "Scan the module for known vulnerabilities reachable from the binary entry points"
run = "go tool govulncheck ./..."

# govulncheck exits 0 in SARIF mode whether or not it finds
# vulnerabilities -- the report has them -- so this task surfaces
# findings through Code Scanning rather than failing the run, while a
# genuine scanner failure still exits non-zero.
[tasks.vuln-sarif]
description = "Emit the govulncheck results as SARIF to <file> for the security.yml upload"
usage = 'arg "<file>"'
run = 'go tool govulncheck -format sarif ./... > "$usage_file"'

# gitleaks exits 0 when the underlying git invocation fails: it logs the
# error, reports "0 commits scanned", then prints "no leaks found". A
# repository it cannot resolve therefore reads as a clean scan. Assert
# the walk reached at least one commit so an empty scan fails loudly.
# The output goes to a file rather than through a pipe so gitleaks' own
# exit code survives.
[tasks.gitleaks]
description = "Scan the working tree and full git history for committed secrets"
run = '''
#!/usr/bin/env bash
set -eu
log=$(mktemp)
trap 'rm -f "$log"' EXIT

status=0
gitleaks git --verbose . >"$log" 2>&1 || status=$?
cat "$log"

if ! grep -qE '[1-9][0-9]* commits scanned' "$log"; then
    echo "gitleaks walked 0 commits, so this scan proves nothing." >&2
    echo "Check that the repository resolves from $(pwd)." >&2
    exit 1
fi
exit "$status"
'''

# gomodscan flags dependencies that pkg.go.dev marks as retracted or
# deprecated (S2C2F SCA-3), and dependencies the OSV malicious-package
# registry flags as malware (S2C2F ING-3). It reads vendor/modules.txt
# for the module set, so run `mise run vendor` first when it is stale.
# Exits 1 on findings, 2 on tool failure.
[tasks.gomodscan]
description = "Scan each vendored module for supply-chain concerns in one pass"
run = "go tool gomodscan"

# Unlike the gomodscan gate task, a findings exit (1) does not fail this
# one -- Code Scanning surfaces severity downstream -- but a tool failure
# (exit 2) still propagates.
[tasks.gomodscan-sarif]
description = "Emit the gomodscan findings as SARIF to <file> for the security.yml upload"
usage = 'arg "<file>"'
run = '''
#!/usr/bin/env bash
set -uo pipefail
go tool gomodscan -format sarif > "$usage_file"
rc=$?
if [ "$rc" -gt 1 ]; then exit "$rc"; fi
'''

# Pairs govulncheck with the gomodscan and gitleaks scanners so the
# security.yml workflow invokes one task rather than enumerate the
# scanner set in YAML.
[tasks.security]
description = "Security-only sub-aggregator"
run = [
  "mise run vuln",
  "mise run gomodscan",
  "mise run gitleaks",
  "mise run audit",
]

# The Python analogue of vuln: export the locked closure to a pylock
# file, query each pinned version against the PyPI advisory database, and
# exit nonzero on any match. --no-emit-project drops the unversioned
# workspace root, which pip-audit would otherwise skip with a note. The
# export and the HTTP cache both go in a throwaway dir the trap removes
# on exit, so the run stays hermetic.
[tasks.audit]
description = "Audit the locked Python dependencies against the advisory database"
run = '''
#!/usr/bin/env bash
set -eu
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
uv export --quiet --format pylock.toml --no-emit-project -o "$work/pylock.toml"
uv run pip-audit --cache-dir "$work/cache" --locked "$work"
'''

# --- Dependencies ---

[tasks.tidy]
description = "Tidy go.mod"
run = "go mod tidy"

[tasks.verify]
description = "Verify dependencies"
run = "go mod verify"

# Vendoring makes new transitive dependencies show up as a visible diff
# at PR review time, turning the trust decision on each addition into a
# human one.
[tasks.vendor]
description = "Vendor dependencies into ./vendor"
run = ["go mod tidy", "go mod vendor"]

# CI runs this on every PR; contributors run `mise run vendor` and commit
# the result.
[tasks.vendor-check]
description = "Check that vendor/, go.mod, and go.sum are in sync"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go mod tidy
go mod vendor
if ! git diff --exit-code -- go.mod go.sum vendor/; then
    echo "vendor drift detected — run 'mise run vendor' and commit" >&2
    exit 1
fi
'''

# The Python counterpart to vendor-check. CI runs this on every PR;
# contributors run `uv lock` and commit the result.
[tasks.lock-check]
description = "Check that uv.lock is in sync with pyproject.toml"
run = "uv lock --check"

# --- Aggregators ---
# Composed quality gates so a contributor hits one task instead of
# chaining the underlying single-purpose ones from memory. tidy
# normalizes go.mod / go.sum first so the rest of the gate sees the
# canonical dependency set; vendor-check at the end catches any drift the
# rest of the gate introduced.

[tasks.check]
description = "Fast quality bar for save-time and routine pre-push runs"
run = [
  "mise run tidy",
  "mise run verify",
  "mise run lint",
  "mise run test",
  "mise run vuln",
  "mise run vendor-check",
]

# Layers the race detector, the inner-loop fuzz sweep (30 seconds per
# target by default; override via FUZZ_TIME), and the full-history
# gitleaks scan on top of check. Slower than check by minutes rather than
# seconds, so kept off the inner-loop path.
[tasks.check-all]
description = "Comprehensive quality bar for release-prep sweeps"
run = [
  "mise run check",
  "just test-go-race",
  "mise run fuzz",
  "mise run gitleaks",
]

# --- APM ---

# APM merges hook declarations into .claude/settings.json additively and
# never reconciles, while `apm audit --ci` replays the same merge from an
# empty tree and compares. A plain `apm install` therefore leaves two
# kinds of wreckage: a reordering the replay disagrees with forever, and
# entries for a hook upstream has since deleted, still firing. Clearing
# the keys APM owns first hands the merge the empty slate its replay
# assumes. Drop only the hooks key, so a hand-authored setting elsewhere
# in the file survives. Reach for this on any change under .apm/hooks/
# and on any dependency bump.
[tasks.apm-sync]
description = "Redeploy APM primitives from a cleared hook state"
depends_post = ["lint-apm"]
run = '''
#!/usr/bin/env bash
set -eu
if [[ -f .claude/settings.json ]]; then
    jq 'del(.hooks)' .claude/settings.json > .claude/settings.json.tmp
    mv .claude/settings.json.tmp .claude/settings.json
fi
rm -f .claude/apm-hooks.json
apm install
'''

# `apm audit --ci` replays the install into a scratch tree and diffs it
# against the deployed files, which catches both hook-merge failures
# above along with lockfile and content drift. --no-policy keeps the gate
# offline: org policy discovery reaches for the git remote, and a
# pre-commit hook has no business making a network call.
[tasks.lint-apm]
description = "Check deployed APM primitives against the lockfile"
run = "apm audit --ci --no-policy"

# --- Utilities ---

[tasks.version]
description = "Print version information"
quiet = true
run = '''
#!/usr/bin/env bash
set -eu
version=$(git describe --tags --abbrev=7 2>/dev/null || git rev-parse --short=7 HEAD 2>/dev/null || echo "DEV")
commit=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "")
date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "unknown")
echo "Version: $version"
echo "Commit:  $commit"
echo "Date:    $date"
'''

# Run once after cloning the repo, and whenever .vale.ini's Packages list
# changes. CI runs this before lint-prose.
[tasks.vale-sync]
description = "Sync Vale styles and dictionaries"
run = "vale sync"

[tasks.prek]
description = "Run pre-commit hooks on changed files"
run = "prek"

# Useful after a hook config change or before a release sweep.
[tasks.prek-all]
description = "Run pre-commit hooks on every file in the tree"
run = "prek run --all-files"

# post-commit removes the COMMIT_AGENTMSG draft once a commit succeeds.
# Skip that stage and drafts accumulate across commits, which is how an
# agent ends up committing a message it wrote for an earlier change.
[tasks.prek-install]
description = "Install the project's git hooks (commit-msg, pre-commit, pre-push, post-commit)"
run = "prek install -t commit-msg -t pre-commit -t pre-push -t post-commit"

# --- Changelog ---

# `cog changelog` emits the release sections and nothing else. The
# preamble it splices at -- the H1, the pointer to the spec, and the
# `- - -` line that `cog bump` splits the file on -- has to be written
# here, and the byte-level shape matters: the marker line opening the
# newest section sits directly under `- - -`, with no blank between,
# because that is where `cog bump` writes it. The trailing trim exists
# because `cog changelog` closes its output with two blank lines.
[tasks.generate-changelog]
description = "Generate the full CHANGELOG.md from Conventional Commit history"
run = '''
#!/usr/bin/env bash
set -eu
{
  echo "# Changelog"
  echo
  echo "All notable changes to this project will be documented in this file. See [conventional commits](https://www.conventionalcommits.org/) for commit guidelines."
  echo
  echo "- - -"
  cog changelog | perl -0pe 's/\n+\z/\n/'
} > CHANGELOG.md
'''

# Useful during release prep to see what `cog changelog` will emit before
# committing the regeneration.
[tasks.preview-changelog]
description = "Preview the changelog entries since the last tagged release"
run = "cog changelog --at $(git describe --tags)..HEAD -t full_hash | rumdl check -d MD041 --fix --stdin"

# Pass a version, or omit it for HEAD. Output goes to stdout. MD041 is
# disabled for the heading-less fragment; without --isolated, MD013 stays
# off via .rumdl.toml so the full commit hashes are never wrapped.
[tasks.generate-release-notes]
description = "Generate release notes for a specific version"
run = '''
#!/usr/bin/env bash
set -eu
v=$([[ -n "${1:-}" ]] && echo "v$1" || echo "..$(git rev-parse HEAD)")
cog changelog --at "$v" -t full_hash | rumdl check -d MD041 --fix --stdin
'''

# The vendir drift gate. Same task-file syntax, namespace, selection,
# and pin rules as format.toml in this directory -- with two twists.
#
# repotools itself does not include this file: it is the publisher, so
# it has no vendir.yml and nothing vendored to check. Selection working
# in both directions is the point of the includes channel.
#
# And vendir is deliberately not pinned in the shared baseline drop-in.
# A consumer needs vendir before the first sync ever runs -- the
# bootstrap task is `vendir sync` then `mise install` -- so the pin has
# to live in the consumer's own root mise.toml, ahead of the payload.

# vendir has no check mode, so drift detection is a resync compared
# against the committed tree. `git status --porcelain` rather than
# `git diff --exit-code`, because a file the sync newly adds is
# untracked, and untracked files never fail a diff -- the gate would
# stay green while the working tree held unreviewed payload. This only
# works because the vendored content is committed.
["repotools:check-vendored"]
description = "Resync the vendored payload and fail if it drifted from what is committed"
run = '''
#!/usr/bin/env bash
set -euo pipefail
vendir sync
drift=$(git status --porcelain -- vendir.yml vendir.lock.yml .config/mise/conf.d .repotools)
if [ -n "$drift" ]; then
  echo "$drift"
  echo "vendored payload drifted from the committed tree -- review the resync above, then commit it or fix vendir.yml" >&2
  exit 1
fi
echo "vendored payload matches the committed tree"
'''

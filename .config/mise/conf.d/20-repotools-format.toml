#:schema https://mise.jdx.dev/schema/mise.json
# Shared format tasks. Namespaced `repotools:` so a consumer's own task
# names can never collide, and a consumer redefining one of these keys in
# its root mise.toml wins over this file.
#
# Every task pins the tool it invokes. Without the pin, a consumer
# pinning a different version in its own mise.toml silently wins and the
# shared task runs against a binary it was never validated on.

# In-place TOML formatter -- the fixer paired with the lint-toml gate's
# --check mode. Rewrites whitespace and style only; key and array order
# are preserved (schema-driven reordering is disabled in tombi.toml).
# Excludes and lockfile skips come from the consumer's tombi.toml.
[tasks."repotools:format-toml"]
description = "Format TOML in place via tombi"
tools = { tombi = "1.2.5" }
run = "tombi format"

[tasks."repotools:format-markdown"]
description = "Format Markdown in place (whitespace, list markers, code fences)"
usage = 'arg "<paths>..." default="."'
tools = { rumdl = "0.2.48" }
run = "rumdl fmt $usage_paths"

[tasks."repotools:format-config"]
description = "Format JSON / JS / TS in place via biome"
usage = 'arg "<paths>..." default="."'
tools = { biome = "2.5.6" }
run = "biome format --write $usage_paths"

# --fmt is still an unstable just feature; pass --unstable explicitly so
# the task works regardless of the consumer Justfile's `set unstable`.
# Takes no path args: --fmt only ever rewrites the justfile just resolved
# for this invocation.
[tasks."repotools:format-just"]
description = "Format the Justfile in place with just's own formatter"
tools = { just = "1.57.0" }
run = "just --fmt --unstable"

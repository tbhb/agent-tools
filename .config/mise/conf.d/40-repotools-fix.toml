#:schema https://mise.jdx.dev/schema/mise.json
# Shared fix tasks. Same namespace, override, and tool-pinning rules as
# the format drop-in.

# Complement to repotools:format-markdown, which only rewrites whitespace
# and ordering, not semantic lints.
[tasks."repotools:fix-markdown"]
description = "Apply rumdl's auto-fixable Markdown rules"
usage = 'arg "<paths>..." default="."'
tools = { rumdl = "0.2.48" }
run = "rumdl check --fix $usage_paths"

---
name: apm-package

# Validates the shared APM package for tbhb repositories whenever the
# package surface changes, with two gates.
#
#   validate: runs the pinned apm CLI through primitive validation, a
#   frozen install against apm.lock.yaml, the lockfile/on-disk audit,
#   and a working-tree check proving the committed deployed copies
#   under .claude/ match the .apm/ sources. The CLI is a mise pin like
#   every other tool here, so mise.lock carries its checksum and
#   repotools:check-toolchain covers it.
#
#   scan-skills: runs Cisco's skill-scanner over .apm/skills via the
#   upstream reusable workflow, uploading SARIF to code scanning so a
#   risky skill change surfaces as a PR annotation.

on:
  push:
    branches: [main]
    paths:
      - apm.yml
      - apm.lock.yaml
      - .apm/**
      - hooks/**
      - .claude/rules/**
      - .claude/skills/**
      - .claude/hooks/**
      - .claude/settings.json
      - .claude/apm-hooks.json
      - .github/workflows/apm-package.yml
      # The apm pin and its checksums: a bump changes what every step
      # below runs, so it has to trigger this workflow.
      - mise.toml
      - mise.lock
  pull_request:
    paths:
      - apm.yml
      - apm.lock.yaml
      - .apm/**
      - hooks/**
      - .claude/rules/**
      - .claude/skills/**
      - .claude/hooks/**
      - .claude/settings.json
      - .claude/apm-hooks.json
      - .github/workflows/apm-package.yml
      # The apm pin and its checksums: a bump changes what every step
      # below runs, so it has to trigger this workflow.
      - mise.toml
      - mise.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install_args narrows the install to apm alone. This job runs the
      # CLI and nothing else, so provisioning the whole toolchain would
      # trade the old curl step's speed for tools no step invokes. The
      # action appends --locked on its own once it sees mise.lock, and
      # its shims reach PATH, so the steps below call apm directly.
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          install_args: apm

      - name: Validate primitives
        run: apm compile --validate

      - name: Run frozen install
        run: apm install --frozen

      - name: Audit deployed state
        run: apm audit --ci

      - name: Check deployed copies for drift
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::apm install changed the tree; run 'just apm-sync' locally and commit the result"
            exit 1
          fi

  scan-skills:
    name: scan-skills
    permissions:
      contents: read
      actions: read
      security-events: write
    # yamllint disable-line rule:line-length
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@605afdc5c7ea887c07e2afeb0fadc1452c07bfa7 # 2.0.12
    with:
      skill_path: .apm/skills
      format: sarif
      fail_on_severity: high

---
# Install `vale` from a pinned vale-cli/vale release archive and verify
# it against the published checksums file. Mirrors setup-just: every
# workflow that needs `vale` consumes this composite instead of taking
# whatever `brew bundle` happens to serve, so the prose gates run a
# known binary rather than floating with upstream. The default version
# pins the project-wide release; Renovate's github-releases datasource
# tracks it via the trailing marker on the literal, which routes Vale
# bumps through the same review and cooldown as every other pin.
#
# The install directory goes on GITHUB_PATH rather than relying on
# /usr/local/bin: the prose workflows prepend Homebrew's prefix to the
# PATH, and a Brewfile-installed vale would otherwise shadow the pinned
# binary. Prepending here keeps the pinned copy first regardless of
# where this composite sits in the job.
#
# Runner dispatch covers the platforms vale publishes. Upstream ships no
# Windows/ARM64 asset, so that combination fails loudly rather than
# silently installing the wrong architecture.

name: Setup vale
description: Install vale from a pinned vale-cli/vale release archive, verified against the published checksums.

inputs:
  vale-version:
    description: vale version to install (defaults to the project-wide pinned release).
    required: false
    default: '3.17.0'  # renovate: datasource=github-releases depName=vale-cli/vale

runs:
  using: composite
  steps:
    - name: Install vale
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VALE_VERSION: ${{ inputs.vale-version }}
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   asset_platform="Linux_64-bit";  ext="tar.gz" ;;
          Linux-ARM64) asset_platform="Linux_arm64";   ext="tar.gz" ;;
          macOS-X64)   asset_platform="macOS_64-bit";  ext="tar.gz" ;;
          macOS-ARM64) asset_platform="macOS_arm64";   ext="tar.gz" ;;
          Windows-X64) asset_platform="Windows_64-bit"; ext="zip"   ;;
          *) echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        asset="vale_${VALE_VERSION}_${asset_platform}.${ext}"
        checksums="vale_${VALE_VERSION}_checksums.txt"

        tmp=$(mktemp -d)
        cd "${tmp}"

        gh release download "v${VALE_VERSION}" \
          --repo vale-cli/vale \
          --pattern "${asset}" \
          --pattern "${checksums}"

        # sha256sum (Linux/Windows) and shasum -a 256 (macOS, which ships
        # Perl shasum not GNU coreutils) diverge on --ignore-missing, so
        # verify a single-line filtered file rather than the full list.
        grep -E "[ *]${asset}\$" "${checksums}" > checksums.filtered
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c checksums.filtered
        else
          shasum -a 256 -c checksums.filtered
        fi

        case "${RUNNER_OS}-${ext}" in
          Linux-tar.gz | macOS-tar.gz)
            tar -xzf "${asset}"
            ;;
          Windows-zip)
            # GitHub-hosted Windows runners surface GNU tar (no zip
            # support) in Git Bash's PATH ahead of the Windows-native
            # bsdtar. PowerShell's Expand-Archive sidesteps the mismatch.
            powershell -Command "Expand-Archive -Force -Path '${asset}' -DestinationPath '.'"
            ;;
          *) echo "unsupported archive: ${RUNNER_OS}-${ext}" >&2; exit 1 ;;
        esac

        install_dir="${HOME}/.local/vale-pinned"
        mkdir -p "${install_dir}"

        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          install_path="${install_dir}/vale.exe"
          mv vale.exe "${install_path}"
          # Git Bash exports $HOME as a Unix-style path (/c/Users/...);
          # subsequent PowerShell-driven `run:` steps need the Windows
          # form for $GITHUB_PATH entries to resolve.
          cygpath -w "${install_dir}" >> "${GITHUB_PATH}"
        else
          install_path="${install_dir}/vale"
          install -m 0755 vale "${install_path}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
        fi

        "${install_path}" --version

---
default_stages: [pre-commit, pre-push]

# Hooks never touch vendored third-party code; that source is reviewed
# at PR time as part of vendor-tidy, not reformatted to match this
# project's style. Same applies to Vale's synced style packages and
# build output.
exclude: ^(vendor/|\.vale/(Google|write-good|proselint|ai-tells.*)/|bin/|dist/)

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint.yaml --strict
        types: [yaml]

  - repo: https://github.com/vale-cli/vale
    rev: d32b532e2f5ba703ba06a5a6829f9db1fc78a92c  # frozen: v3.15.2
    hooks:
      # Scope the pre-commit-stage hook to the file types .vale.ini
      # actually configures rules for (Markdown + Go source). The
      # upstream hook defaults to types: [text], which passes every
      # text file plus .git/COMMIT_EDITMSG; vale then parses the
      # commit-message buffer as plain text (no extension), backticks
      # lose their code-span meaning, and rules like Google.Spacing
      # flag dotted identifiers even inside backticks. The
      # vale-commit-msg hook among the shared commit-message hooks
      # (below) handles the commit message with a strip-and-vale
      # pipeline that drops git's helper comments and the verbose-diff
      # scissors block before invoking vale. Extend types_or when
      # .vale.ini grows a new section.
      - id: vale
        types_or: [markdown, go]
        # CHANGELOG.md is generated by `cog changelog`, whose Title-Case
        # section headings ("Bug Fixes", "Continuous Integration") are a
        # cocogitto convention, not prose under this project's control.
        # The prose recipes (lint-prose, lint-markdown) already skip it
        # via --glob; .vale.ini cannot exempt it on its own because the
        # explicit per-rule toggles in [*.md] survive an empty
        # BasedOnStyles in the CHANGELOG.md block. Exclude it here too.
        exclude: ^CHANGELOG\.md$
        # Repo-local template; one machine-parseable line per finding.
        args: [--output=project-agent.tmpl]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 9930066c775a2a82838c0b479cd40a83b3788b75  # frozen: v0.2.45
    hooks:
      - id: rumdl-fmt
      - id: rumdl

  # Shared commit-msg gates. This repository publishes them (see
  # .pre-commit-hooks.yaml) and applies them to itself, the same way it
  # treats guard-markdown below: the hooks run from the working tree
  # rather than from a released tag, so an edit to one of these scripts
  # gates the very commit that makes it instead of waiting for a release.
  # That is why the ids resolve locally and no `rev:` appears here.
  #
  # The first four run on the commit-msg stage; commitlint and
  # commit-trailers need only bash/git, while vale-commit-msg and
  # cspell-commit-msg lean on this repo's vale/cspell plus the
  # commit-message scope in .vale.ini and .cspell.jsonc.
  - repo: local
    hooks:
      - id: commit-trailers
        name: commit-trailers
        entry: scripts/commit-trailers.sh
        language: script
        stages: [commit-msg]
        always_run: true

      - id: commitlint
        name: commitlint
        entry: scripts/commitlint.sh
        language: script
        stages: [commit-msg]
        always_run: true

      - id: vale-commit-msg
        name: vale (commit message)
        entry: scripts/vale-commit-msg.sh
        language: script
        stages: [commit-msg]
        always_run: true

      - id: cspell-commit-msg
        name: cspell (commit message)
        entry: scripts/cspell-commit-msg.sh
        language: script
        stages: [commit-msg]
        always_run: true

      # The one post-commit hook. It deletes the COMMIT_AGENTMSG draft
      # once a commit succeeds, so the next commit starts from an absent
      # path rather than a stale draft. Needs the stage installed, which
      # `just prek-install` covers.
      - id: clear-commit-agentmsg
        name: clear COMMIT_AGENTMSG
        entry: scripts/clear-commit-agentmsg.sh
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: just format-go
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: just lint-go
        language: system
        types: [go]
        pass_filenames: false

      # Shell gates, wired the same way as the Go pair above: the recipe
      # owns the file list (git ls-files minus vendor/), so the hooks pass
      # no filenames and only decide *whether* to run. shellcheck comes
      # from the pinned Docker image, shfmt from the Brewfile. The
      # formatter runs first and rewrites in place (a modified file fails
      # the commit, so the contributor reviews and re-stages), matching the
      # `shfmt -w` hook the shared hook repo already publishes; then
      # the correctness linter runs. The `lint-shell-fmt` diff gate has no
      # hook of its own — shfmt has already normalized the file by the time
      # shellcheck runs — and CI still reads it through `just lint`.
      - id: shfmt
        name: shfmt
        entry: just format-shell
        language: system
        types: [shell]
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: just lint-shell
        language: system
        types: [shell]
        pass_filenames: false

      # --fmt reads and writes the whole Justfile, so this hook checks
      # rather than fixes; run `just format-just` to apply.
      - id: just-fmt
        name: just --fmt --check
        entry: just lint-just
        language: system
        files: ^Justfile$
        pass_filenames: false

      # Whole-tree run on every commit. The recipe feeds the checker the git
      # index itself and finishes in well under a second, and its scope
      # lives in .editorconfig-checker.json, so passing filenames here would
      # only give the hook a second, drifting copy of that scope.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: just lint-editorconfig
        language: system
        types: [text]
        pass_filenames: false

      - id: vendor-tidy
        name: go mod tidy + vendor drift check
        entry: bash -c 'go mod tidy && go mod vendor && git diff --exit-code -- go.mod go.sum vendor/'
        language: system
        files: ^(go\.mod|go\.sum|vendor/)
        pass_filenames: false

      # Tree-wide spell check at pre-commit and pre-push. Scoped off
      # the commit-msg stage so the cspell-commit-msg hook from
      # the shared hook repo owns the commit buffer with
      # worktree-safe config resolution.
      - id: cspell
        name: cspell
        entry: cspell --config .cspell.jsonc --no-summary --no-progress --no-must-find-files
        language: system
        stages: [pre-commit, pre-push]
        types: [text]

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: just lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # Python gates, wired like the Go and shell pairs above: the recipe
      # owns the scope (pyproject.toml), so the hooks pass no filenames
      # and only decide *whether* to run. The formatter runs first and
      # rewrites in place (a modified file fails the commit, so the
      # contributor reviews and re-stages), then the correctness linters.
      - id: ruff-format
        name: ruff format
        entry: just format-py
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: just lint-ruff
        language: system
        types: [python]
        pass_filenames: false

      - id: pyrefly
        name: pyrefly
        entry: just lint-types
        language: system
        types: [python]
        pass_filenames: false

      # APM's hook merge is additive and never reconciles a declaration that
      # was removed or that sorts ahead of an existing one, so .claude/ can
      # disagree with .apm/ while every file involved looks reasonable. The
      # apm-package workflow already catches it, but only after a push, and
      # `apm install` is not the fix — `just apm-sync` is. This hook moves
      # that finding to the commit.
      #
      # Scoped to the inputs that can change the deployed set. apm.lock.yaml
      # is deliberately absent: it never records hook declarations, so it
      # stays byte-identical across a hook add or delete.
      - id: apm-audit
        name: apm audit
        entry: just lint-apm
        language: system
        files: ^(\.apm/|apm\.yml$|\.claude/(settings|apm-hooks)\.json$)
        pass_filenames: false

      # uv.lock drift, the Python counterpart to the vendor-tidy hook
      # above. Scoped to the files that can cause the drift.
      - id: lock-check
        name: uv lock --check
        entry: just lock-check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # This repository publishes the check (see .pre-commit-hooks.yaml)
      # and applies it to itself. It runs the recipe, which builds from the
      # working tree, rather than the published manifest: a change to the
      # detector then gates the very commit that makes it, instead of being
      # checked against the last released binary.
      - id: guard-markdown
        name: guard-markdown
        entry: just lint-markdown-wrap
        language: system
        types: [markdown]
        pass_filenames: false
